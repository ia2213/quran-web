<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lisez le Coran en ligne avec récitations audio, traductions et translitérations.">
  <meta name="theme-color" content="#10B981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coran">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2310B981'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='serif'>ق</text></svg>">
  <title>Coran — Lecture en ligne</title>
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-content">
        <h1 class="logo">📖 Coran</h1>
        <div class="header-actions">
          <button class="icon-btn" id="themeToggle" title="Changer le thème">
            <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="search-container">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Rechercher une sourate..." autocomplete="off">
        <button class="search-clear" id="searchClear" style="display:none">✕</button>
      </div>
      <div class="search-results" id="searchResults" style="display:none"></div>
    </div>

    <!-- OPTIONS DE LECTURE (accueil, avant la grille) -->
    <div class="reading-options-bar">
      <div class="options-row">
        <div class="mode-selector">
          <label>Mode</label>
          <div class="mode-chips">
            <button class="mode-chip active" data-mode="single">Single</button>
            <button class="mode-chip" data-mode="range">Plage</button>
            <button class="mode-chip" data-mode="page">Verse</button>
            <button class="mode-chip" data-mode="loop">Boucle</button>
          </div>
        </div>
        <div class="options-row-right">
          <button class="loop-toggle" id="loopToggle" title="Activer la boucle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            <span>Boucle</span>
          </button>
          <div class="reciter-select">
            <select id="reciterSelect"></select>
          </div>
        </div>
      </div>
      <!-- Config plage (visible si mode=range) -->
      <div class="range-config-global" id="rangeConfigGlobal" style="display:none">
        <div class="range-inputs">
          <div class="range-field">
            <label>Du verset</label>
            <input type="number" id="rangeStartGlobal" min="1" value="1">
          </div>
          <div class="range-field">
            <label>Au verset</label>
            <input type="number" id="rangeEndGlobal" min="1" value="5">
          </div>
          <button class="range-apply-btn" id="rangeApplyBtnGlobal">Appliquer</button>
        </div>
      </div>
      <!-- Config verset (visible si mode=verse) -->
      <div class="page-config-global" id="pageConfigGlobal" style="display:none">
        <div class="page-input-row">
          <label style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap">Aller au verset</label>
          <input type="number" id="pageInputGlobal" min="1" max="604" value="1" style="width:60px;padding:4px 6px;border:0.5px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text);font-size:12px;font-family:inherit;outline:none">
          <button class="page-go-btn" id="pageGoBtnGlobal">Aller</button>
        </div>
      </div>
    </div>

    <main class="main">
      <section class="section" id="surahList">
        <div class="section-header">
          <h2>Sourates</h2>
          <span class="badge" id="surahCount">114 sourates</span>
        </div>
        <div class="surah-grid" id="surahGrid"></div>
      </section>

      <section class="section" id="readerSection" style="display:none">
        <div class="reader-header">
          <button class="back-btn" id="backToList">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Retour
          </button>
          <div class="reader-info">
            <h2 id="readerSurahName">—</h2>
            <span id="readerVerseInfo" class="verse-badge">Verset 1</span>
          </div>
        </div>

        <div class="text-options">
          <button class="opt-btn active" data-opt="arabic">Arabe</button>
          <button class="opt-btn" data-opt="transliteration">Phonétique</button>
          <button class="opt-btn" data-opt="translation">Traduction</button>
        </div>

        <div class="verse-display" id="verseDisplay">
          <div class="verse-arabic" id="verseArabic">
            <p class="verse-number" id="verseNumber">1</p>
            <p class="arabic-text" id="arabicText">—</p>
          </div>
          <div class="verse-transliteration" id="verseTransliteration" style="display:none">
            <p class="translit-text" id="transliterationText">—</p>
          </div>
          <div class="verse-translation" id="verseTranslation" style="display:none">
            <p class="translation-text" id="translationText">—</p>
          </div>
        </div>

        <div class="player-controls">
          <div class="player-info">
            <span class="player-status" id="playerStatus">Prêt</span>
            <span class="player-time" id="playerTime">0:00</span>
          </div>
          <div class="player-buttons">
            <button class="player-btn" id="prevSurahBtn" title="Sourate précédente">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
            </button>
            <button class="player-btn" id="prevVerseBtn" title="Verset précédent">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg>
            </button>
            <button class="play-btn" id="playBtn" title="Lecture / Pause">
              <svg class="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <svg class="pause-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button class="player-btn" id="nextVerseBtn" title="Verset suivant">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 19 14 12 23 5 23 19"/><polygon points="10 19 5 12 10 5 10 19"/></svg>
            </button>
            <button class="player-btn" id="nextSurahBtn" title="Sourate suivante">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 20 15 12 5 4 5 20"/><line x1="19" y1="19" x2="19" y2="5"/></svg>
            </button>
          </div>
          <div class="player-progress">
            <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0" step="0.1">
          </div>
        </div>

        <button class="download-btn" id="downloadBtn" title="Télécharger pour hors-ligne">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Télécharger</span>
        </button>
      </section>
    </main>

    <audio id="audioPlayer" style="display:none"></audio>

    <footer class="footer">
      <p>Coran.cc — Lecture en ligne du Saint Coran</p>
      <p class="footer-small">Utilise l'API Alquran.cloud pour les textes et récitations</p>
    </footer>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
